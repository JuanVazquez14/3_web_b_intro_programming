<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
    <link rel="icon" href="./bibimbap.png">
</head>

<body>
    <h1>Formulario</h1>
    <form>
        <div>
            <p>Tittle</p>
            <input type="radio" name="title" id="mr">
            <label for="mr">Mr</label>
            <input type="radio" name="title" id="mrs">
            <label for="mrs">Mrs</label>
            <input type="radio" name="title" id="miss">
            <label for="miss">Miss</label>
        </div>
        <div>
            <label for="fistname">First name </label>
            <br>
            <input type="text" id="fistname" placeholder="John...">
        </div>
        <div>
            <label for="LastName">LastName </label>
            <br>
            <input type="text" id="LastName" placeholder="Jonshon...">
        </div>


        <div>
            <label for="email">email</label>
            <br>
            <input type="text" id="email" placeholder="juanito@gmail.com...">
        </div>
        <div>
            <label for="phone">Phone</label>
            <br>
            <input type="number" id="phone" placeholder="5555255">
        </div>

        <div>
            <label for="password">password</label>
            <br>
            <input type="password" id="password" placeholder="Your password is">
        </div>

        <div>
            <br>
            <label for="country">Country</label>
            <br>
            <select name="country" id="country">
                <option value="peru">Perú</option>
                <option value="chile">Chile</option>
                <option value="india">India</option>
                <option value="francia">Francia</option>
            </select>
        </div>
        <div>
            <input type="checkbox" name="" id="terms">
            <label for="terms">I agree to the terms and conditions</label>
        </div>


        <div>
            <label for="message">Message</label>
            <br>
            <textarea name="message" id="message" cols="30" rows="5" placeholder="Write your message..."></textarea>
        </div>
        <div>
            <label for="photo">Your photo</label>
            <br>
            <input type="file" name="photo" id="photo"> 
        </div>

        <div>
            <button type="submit">Sign up</button>
            <button>Reset form</button>
        </div>

    </form>

</body>

</html>
